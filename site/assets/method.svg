<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" role="img" aria-labelledby="title description">
  <title id="title">UniSEM two-stage training and shared instance generation</title>
  <desc id="description">First-stage training on multi-source EMNeuron data produces a reusable NeuroStruct generalist with a SAM-initialized ViT-L, a micro-SAM dense decoder, and HQ-style cross-layer correction. Second-stage LightFT specializes that checkpoint using target labels: original encoder weights are frozen while Q/V LoRA in all 24 blocks and the decoder and correction head are trained. Both models predict foreground and distance fields for the shared two-dimensional instance workflow.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#55555d"/></marker>
    <marker id="blue-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#0066cc"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1d1d1f;font-size:24px}
      .stage{font-size:26px;font-weight:700;letter-spacing:-.5px}
      .heading{font-size:28px;font-weight:700;letter-spacing:-.6px}
      .muted{fill:#55555d}
      .blue{fill:#0066cc}
      .strong{font-weight:600}
    </style>
  </defs>
  <text class="stage" x="24" y="32">1. First-stage training</text>
  <text class="stage" x="650" y="32">2. Target specialization</text>
  <rect x="24" y="58" width="518" height="246" rx="8" fill="#f5f5f7" stroke="#d2d2d7"/>
  <text class="heading" x="48" y="101">NeuroStruct</text>
  <text class="muted" x="48" y="141">Multi-source EM · EMNeuron</text>
  <line x1="48" y1="160" x2="518" y2="160" stroke="#d2d2d7"/>
  <text x="48" y="196">SAM-initialized ViT-L</text>
  <text x="48" y="234">µSAM dense decoder</text>
  <text x="48" y="272">HQ-style cross-layer correction</text>
  <path d="M283 305V326" fill="none" stroke="#55555d" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="24" y="338" width="518" height="66" rx="6" fill="#1d1d1f"/>
  <text x="283" y="380" text-anchor="middle" style="fill:white;font-weight:600">Reusable generalist checkpoint</text>
  <path d="M543 371H592V182H632" fill="none" stroke="#0066cc" stroke-width="2" marker-end="url(#blue-arrow)"/>
  <text class="blue strong" x="594" y="145" text-anchor="middle">Reuse</text>
  <rect x="650" y="58" width="526" height="246" rx="8" fill="#f5f5f7" stroke="#d2d2d7"/>
  <text class="heading" x="674" y="101">LightFT</text>
  <text class="muted" x="674" y="141">Source checkpoint + target labels</text>
  <line x1="674" y1="160" x2="1152" y2="160" stroke="#d2d2d7"/>
  <text x="674" y="196">Freeze original encoder weights</text>
  <text class="blue" x="674" y="234">Train Q/V LoRA · all 24 blocks</text>
  <text class="blue" x="674" y="272">Train decoder + correction head</text>
  <path d="M913 305V326" fill="none" stroke="#55555d" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="650" y="338" width="526" height="66" rx="6" fill="#1d1d1f"/>
  <text x="913" y="380" text-anchor="middle" style="fill:white;font-weight:600">Target expert · same dense interface</text>
  <path d="M283 405V433M913 405V433" fill="none" stroke="#55555d" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="24" y="444" width="1152" height="90" rx="8" fill="white" stroke="#d2d2d7"/>
  <text x="48" y="478" class="strong">Foreground + center distance + boundary distance</text>
  <text x="48" y="514" class="muted">Window fusion → watershed → matching RF → 2D instances</text>
</svg>
